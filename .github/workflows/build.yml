# Devcontainer imajını derler; içinde ortam kontrolünü, colcon build'i ve testleri çalıştırır.
name: Ortam ve ders testleri

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - "dersler/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - ".devcontainer/**"
      - "dersler/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  devcontainer:
    name: Devcontainer içinde derle ve test et
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: Devcontainer'ı derle ve komutları çalıştır
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: bash scripts/ci_hepsi.sh

      - name: Sonuçları özetle
        if: always()
        run: |
          {
            echo "## Ortam kontrolü"
            echo '```'
            cat ci-sonuc/ortam.txt 2>/dev/null || echo "(çıktı yok)"
            echo '```'
            echo "## Test sonuçları"
            echo '```'
            grep -E "^Summary:|tests, .* errors, .* failures" ci-sonuc/test.txt 2>/dev/null || echo "(çıktı yok)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ortam=$(grep -E "^\[(TAMAM|HATA)\]|^Sonuç:" ci-sonuc/ortam.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g')
          test=$(grep -E "^Summary:" ci-sonuc/test.txt 2>/dev/null | tail -1)
          echo "::notice title=Ortam kontrolü::${ortam:-çıktı yok}"
          echo "::notice title=Test sonuçları::${test:-çıktı yok}"
