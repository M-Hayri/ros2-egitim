site_name: Mavi Gölge ROS 2 Eğitimi
site_description: ROS 2'yi uygulayarak öğrenmek için açık kaynak, etkileşimli eğitim.
site_author: Mavi Gölge Yazılım Ekibi
# Depo adresi belli olunca scripts/depo_adini_ayarla.sh bu satırları doldurur.
repo_url: https://github.com/M-Hayri/ros2-egitim
edit_uri: edit/main/docs/

copyright: Kod MIT, içerik CC BY 4.0 lisanslıdır.

theme:
  name: material
  language: tr
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Koyu temaya geç
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Açık temaya geç

# Soru bankası docs/ dışında; mkdocs serve değişiklikleri izlesin.
watch:
  - sorular

extra_css:
  - assets/egitim/egitim.css

# Widget ve soru bileşenleri. navigation.instant bilerek kapalı:
# sayfa geçişlerinde betik her sayfada baştan çalışır.
extra_javascript:
  - assets/egitim/egitim.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  # Soru bankası: sorular/<kimlik>.md dosyaları derleme anında sayfaya eklenir.
  # check_paths: eksik dosya derlemeyi düşürür.
  - pymdownx.snippets:
      base_path: [sorular]
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Ana sayfa: index.md
  - Başlamadan önce: baslarken.md
  - Seviye 0 · Giriş: seviye-0/index.md
  - Seviye 1 · İletişim: seviye-1/index.md
  - Seviye 2 · Etkileşim: seviye-2/index.md
  - Seviye 3 · Sistem kurmak: seviye-3/index.md
  - Seviye 4 · Uzay ve zaman: seviye-4/index.md
  - Seviye 5 · Araç kutusu: seviye-5/index.md
  - Seviye 6 · Simülasyon: seviye-6/index.md
  - Bitirme projesi: bitirme/index.md
  - Sözlük: sozluk/index.md
  - Katkı:
      - Bileşen kataloğu: katki/bilesenler.md
